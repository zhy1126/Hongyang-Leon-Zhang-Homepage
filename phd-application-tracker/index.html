<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="2027 PhD application tracker">
  <title>2027 PhD Application Tracker</title>
  <style>
    :root{--ink:#20252d;--muted:#6a737d;--line:#d9dee5;--paper:#f5f6f7;--white:#fff;--accent:#2c5f8f;--hk:#e8eef6;--us:#f4edd2;--uk:#e6eee2}
    *{box-sizing:border-box} html{font-size:16px} body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.45}
    .wrap{max-width:1480px;margin:0 auto;padding:34px 30px 54px}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:20px}.top h1{margin:0;font-size:clamp(1.7rem,3vw,2.35rem);font-weight:700;letter-spacing:-.035em}.top p{margin:7px 0 0;color:var(--muted);font-size:.95rem}.updated{color:var(--muted);font-size:.78rem;white-space:nowrap}.table-shell{background:var(--white);border:1px solid var(--line);overflow:auto}.tracker{width:100%;min-width:1030px;border-collapse:collapse;table-layout:fixed}.tracker th{background:#eef0f2;color:#343b44;text-align:left;font-size:.78rem;letter-spacing:.04em;font-weight:700;padding:13px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}.tracker th:nth-child(1){width:10%}.tracker th:nth-child(2){width:16%}.tracker th:nth-child(3){width:16%}.tracker th:nth-child(4){width:18%}.tracker th:nth-child(5){width:30%}.tracker th:nth-child(6){width:7%}.tracker th:nth-child(7){width:10%}.tracker td{vertical-align:top;padding:15px 14px;border-bottom:1px solid var(--line);font-size:.9rem}.tracker tr:last-child td{border-bottom:0}.area{font-weight:650}.region-hong-kong{background:var(--hk)}.region-us{background:var(--us)}.region-uk{background:var(--uk)}.school a,.program a{color:var(--ink);font-weight:700;text-decoration:none;border-bottom:1px solid #94a8bb}.school a:hover,.program a:hover{color:var(--accent);border-color:var(--accent)}.program small{display:block;color:var(--muted);font-size:.76rem;margin-top:3px}.deadline{font-variant-numeric:tabular-nums}.deadline strong{display:block;font-weight:700}.deadline span{display:block;color:var(--muted);font-size:.76rem;margin-top:3px}.req{color:#414951}.req .tag{display:inline-block;color:#4d5965;background:#f0f2f4;border-radius:4px;padding:2px 6px;margin:0 3px 4px 0;font-size:.76rem}.req-note{font-size:.78rem;color:var(--muted);margin-top:5px}.fee{font-variant-numeric:tabular-nums;white-space:nowrap}.status{width:100%;border:1px solid #c8d1db;border-radius:5px;padding:7px 5px;background:#fff;color:var(--ink);font:inherit;font-size:.78rem}.status:focus{outline:2px solid #91b4d1;outline-offset:1px}.detail{margin-top:8px;color:var(--muted);font-size:.76rem}.detail summary{cursor:pointer;color:var(--accent);font-weight:650}.detail p{margin:8px 0}.sources{display:flex;flex-wrap:wrap;gap:8px}.sources a{color:var(--accent);text-decoration:none}.sources a:hover{text-decoration:underline}.foot{margin-top:14px;display:flex;justify-content:space-between;gap:18px;color:var(--muted);font-size:.78rem}.foot a{color:var(--accent)}
    @media (max-width:760px){.wrap{padding:24px 14px 40px}.top{display:block}.updated{margin-top:10px}.table-shell{background:transparent;border:0;overflow:visible}.tracker,.tracker tbody,.tracker tr,.tracker td{display:block;width:100%;min-width:0}.tracker{border:0}.tracker thead{display:none}.tracker tr{background:#fff;border:1px solid var(--line);margin:0 0 12px;padding:0;border-radius:7px;overflow:hidden}.tracker td{border:0;border-bottom:1px solid #edf0f2;padding:10px 13px}.tracker td:last-child{border-bottom:0}.tracker td::before{display:block;color:var(--muted);font-size:.7rem;letter-spacing:.05em;font-weight:700;margin-bottom:3px}.tracker td:nth-child(1)::before{content:"AREA"}.tracker td:nth-child(2)::before{content:"SCHOOL"}.tracker td:nth-child(3)::before{content:"PROGRAM"}.tracker td:nth-child(4)::before{content:"DDL"}.tracker td:nth-child(5)::before{content:"REQUIREMENT"}.tracker td:nth-child(6)::before{content:"APPLICATION FEE"}.tracker td:nth-child(7)::before{content:"STATUS"}.foot{display:block}.foot span{display:block;margin-top:5px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div><h1>2027 PhD Application Tracker</h1><p>Social simulation · computational social science · criminology</p></div>
      <div class="updated">核验至 2026-09-20</div>
    </header>
    <div class="table-shell">
      <table class="tracker">
        <thead><tr><th>Area</th><th>School</th><th>Program</th><th>DDL</th><th>Requirement</th><th>Application Fee</th><th>Status</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <footer class="foot"><span>日期以官方页面为准；“待核/待公布”表示官网尚未给出或需要在申请系统确认。</span><a href="https://github.com/zhy1126/phd-application-tracker-2027" target="_blank" rel="noopener">GitHub ↗</a></footer>
  </main>
  <script>
    const applications = [
      {area:'Hong Kong', region:'hong-kong', school:'HKU', program:'Law · PhD', schoolUrl:'https://www.law.hku.hk/', programUrl:'https://www.law.hku.hk/prospective-students/research-programmes-phd-2/', ddl:'2026-11-15', ddlSub:'23:59 HKT · main round', fee:'HK$600*', req:['LLB honours + taught LLM','Research proposal','Brief CV + class rank','IELTS 7.0 / each 6.5'], note:'3-year route generally expects a research Master in Law; 4-year route accepts a taught Master in Law or first-class LLB. Faculty says applications are considered in the main round only.', source:'https://www.law.hku.hk/prospective-students/research-programmes-phd-2/'},
      {area:'U.S.', region:'us', school:'Northwestern', program:'Sociology · PhD', schoolUrl:'https://sociology.northwestern.edu/graduate/', programUrl:'https://sociology.northwestern.edu/graduate/admissions/', ddl:'2026-12-01', ddlSub:'23:59 Central Time', fee:'待核', req:['GRE not required','Academic + personal statement','1000-word research proposal','2–3 letters','Sole-author writing sample ≤30 pp'], note:'IELTS 7.0 minimum if the English requirement applies. The proposal should define a sociological question, theory, evidence and method, and name relevant faculty.', source:'https://sociology.northwestern.edu/graduate/admissions/'},
      {area:'', region:'us', school:'Stanford', program:'Sociology · PhD', schoolUrl:'https://sociology.stanford.edu/doctoral/phd-program', programUrl:'https://sociology.stanford.edu/doctoral/phd-program/applying-phd', ddl:'2026-12-03', ddlSub:'23:59 Pacific Time', fee:'US$125', req:['GRE required','3 letters','Statement of purpose ≤2 pages','Writing sample ≤50 pp','Transcripts + English test'], note:'Department admits to the programme as a whole rather than to one named supervisor. Official page asks for a CV/resume optionally and a writing sample demonstrating original research.', source:'https://sociology.stanford.edu/doctoral/phd-program/applying-phd'},
      {area:'', region:'us', school:'NYU', program:'Sociology · PhD', schoolUrl:'https://as.nyu.edu/departments/sociology.html', programUrl:'https://nyu-public.courseleaf.com/graduate/arts-science/programs/sociology-phd/', ddl:'2026-12-15', ddlSub:'expected · confirm in GSAS portal', fee:'待核', req:['GSAS online application','Statement + CV + transcripts','Letters + writing sample','GRE / English: portal check'], note:'The current NYU bulletin describes a 72-credit Sociology PhD with theory, statistics, research methods and dissertation training. Deadline is carried from NYU’s current Sociology programme listing; verify the 2027 GSAS page before submitting.', source:'https://nyu-public.courseleaf.com/graduate/arts-science/programs/sociology-phd/'},
      {area:'', region:'us', school:'Princeton', program:'Sociology · PhD', schoolUrl:'https://sociology.princeton.edu/graduate-program', programUrl:'https://gradschool.princeton.edu/academics/degrees-requirements/fields-study/sociology', ddl:'2026-12-15', ddlSub:'23:59 Eastern Time', fee:'US$90', req:['GRE required','Writing sample ≤25 pp','Transcripts + letters','SOP / research fit'], note:'Five-year programme. A sociology undergraduate degree is not required, and the department lists computational modelling and machine learning among available methods.', source:'https://gradschool.princeton.edu/academics/degrees-requirements/fields-study/sociology'},
      {area:'', region:'us', school:'Michigan', program:'Sociology · PhD', schoolUrl:'https://lsa.umich.edu/soc/graduates.html', programUrl:'https://lsa.umich.edu/soc/graduates/application-procedures.html', ddl:'2026-12-01', ddlSub:'23:59 Eastern Time', fee:'US$90*', req:['GRE not considered','Academic statement','Personal statement + transcripts','Letters','IELTS 6.5 minimum if required'], note:'A sociology degree is not required. Admissions emphasise research-process understanding, academic aptitude and persistence; all materials, including letters, must arrive by the deadline.', source:'https://lsa.umich.edu/soc/graduates/application-procedures.html'},
      {area:'', region:'us', school:'Duke', program:'Sociology · PhD', schoolUrl:'https://sociology.duke.edu/graduate', programUrl:'https://gradschool.duke.edu/academics/programs-degrees/sociology/', ddl:'2026-12-17', ddlSub:'Fall 2027 · confirm portal time', fee:'US$105', req:['Statement of purpose','Transcripts + letters','English test if required','Computational social science track'], note:'Duke lists Social Networks & Computational Social Science as a graduate specialization. The Graduate School generally seeks IELTS 7.0; verify any programme-specific test policy in the live application.', source:'https://gradschool.duke.edu/academics/programs-degrees/sociology/'},
      {area:'U.K.', region:'uk', school:'Cambridge', program:'Criminology · PhD', schoolUrl:'https://www.crim.cam.ac.uk/', programUrl:'https://www.postgraduate.study.cam.ac.uk/courses/directory/lwcrpdpcr/apply', ddl:'2026-12-08', ddlSub:'funding deadline · final 2027-03-25', fee:'£20', req:['Master’s distinction / close','IELTS 7.5 overall, 7.0 each','Research proposal + references','Supervisor fit'], note:'The course page lists the Michaelmas 2027 final deadline as 25 March 2027 and the course funding deadline as 8 December 2026. Contacting a potential supervisor with a concise proposal is encouraged.', source:'https://www.postgraduate.study.cam.ac.uk/courses/directory/lwcrpdpcr/requirements'},
      {area:'', region:'uk', school:'UCL', program:'Security & Crime Science · MPhil/PhD', schoolUrl:'https://www.ucl.ac.uk/security-crime-science/', programUrl:'https://www.ucl.ac.uk/prospective-students/graduate/research-degrees/security-and-crime-science-mphil-phd', ddl:'待公布', ddlSub:'2027/28 page · rolling guidance', fee:'研究学位通常不收处理费', req:['Identify 2 supervisors','~3000-word proposal','CV + transcripts','2 referees + funding plan'], note:'The 2027/28 course page leaves fees and deadlines to be confirmed. Applications are described as rolling and should normally be submitted at least three months before the preferred start date.', source:'https://www.ucl.ac.uk/prospective-students/graduate/research-degrees/security-and-crime-science-mphil-phd'},
      {area:'', region:'uk', school:'Oxford OII', program:'Social Data Science · DPhil', schoolUrl:'https://www.oii.ox.ac.uk/', programUrl:'https://www.oii.ox.ac.uk/study/dphil-in-social-data-science/', ddl:'2027-01-07', ddlSub:'12:00 noon UK time', fee:'£20', req:['Research proposal / statement','Transcripts + references','Computational social science fit','Contact potential supervisor'], note:'The programme explicitly combines computational and social sciences, including network science, machine learning, experiments and algorithm auditing. Start date is October 2027.', source:'https://www.oii.ox.ac.uk/study/dphil-in-social-data-science/'}
    ];
    const statusKey='phd-tracker-status-v1';
    const saved=JSON.parse(localStorage.getItem(statusKey)||'{}');
    const labels=['未开始','准备中','已提交'];
    const rows=document.getElementById('rows');
    applications.forEach((item,index)=>{
      const tr=document.createElement('tr');
      tr.className='region-'+item.region;
      const area=item.area?`<td class="area">${item.area}</td>`:'<td aria-label="同上"></td>';
      tr.innerHTML=`${area}<td class="school"><a href="${item.schoolUrl}" target="_blank" rel="noopener">${item.school} ↗</a></td><td class="program"><a href="${item.programUrl}" target="_blank" rel="noopener">${item.program} ↗</a></td><td class="deadline"><strong>${item.ddl}</strong><span>${item.ddlSub}</span></td><td class="req"><div>${item.req.map(tag=>`<span class="tag">${tag}</span>`).join('')}</div><div class="req-note">${item.note}</div><details class="detail"><summary>详情与官方链接</summary><p>${item.note}</p><div class="sources"><a href="${item.source}" target="_blank" rel="noopener">打开官方项目页 ↗</a></div></details></td><td class="fee">${item.fee}</td><td><select class="status" aria-label="${item.school} 状态" data-index="${index}">${labels.map(label=>`<option>${label}</option>`).join('')}</select></td>`;
      rows.appendChild(tr);
      const select=tr.querySelector('select'); select.value=saved[index]||labels[0]; select.addEventListener('change',()=>{saved[index]=select.value;localStorage.setItem(statusKey,JSON.stringify(saved));});
    });
  </script>
</body>
</html>
